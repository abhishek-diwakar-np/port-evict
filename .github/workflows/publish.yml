name: Stage release on npm

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
      - run: npm run test:integration

  stage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set release version
        run: |
          version=$(node scripts/ci-version.js)
          npm version "$version" --no-git-tag-version
      - name: Check whether this version exists
        id: registry
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { name, version } = require('./package.json');
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;

          async function checkVersion() {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            if (!response.ok && response.status !== 404) {
              throw new Error(`npm registry returned HTTP ${response.status}`);
            }
            const shouldStage = response.status === 404;
            const message = shouldStage
              ? `${name}@${version} is not published. The workflow will attempt to stage it for approval.`
              : `${name}@${version} is already published. Staging was skipped.`;
            console.log(message);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `stage=${shouldStage}\n`);
          }

          checkVersion().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Stage package
        if: steps.registry.outputs.stage == 'true'
        run: |
          npm stage publish --access public
          echo 'Package staged. Review and approve it in Staged Packages on npmjs.com.' >> "$GITHUB_STEP_SUMMARY"
